<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Logistics Pro | Fleet Admin Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #c4c7c7; border-radius: 4px; }
  @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  button { font-family: 'Inter', sans-serif; }
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const T = {
  primary:    "#001b44",
  primaryC:   "#002f6c",
  onPrimary:  "#ffffff",
  bg:         "#f8f9ff",
  surface0:   "#ffffff",
  surface1:   "#eff4ff",
  surface2:   "#e5eeff",
  surfaceDim: "#cbdbf5",
  onSurface:  "#0b1c30",
  onSurfaceV: "#444748",
  secondary:  "#006d35",
  secondaryC: "#8df9a8",
  onSecC:     "#007439",
  amber:      "#ffb77d",
  amberBg:    "#ffdcc3",
  error:      "#ba1a1a",
  errorBg:    "#ffdad6",
  outline:    "#c4c7c7",
};

const Icon = ({ name, size = 20, color = "currentColor", filled = false }) => {
  const icons = {
    dashboard: <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill={filled ? color : "none"} stroke={filled ? "none" : color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>,
    truck: <><rect x="1" y="3" width="15" height="13" rx="1" stroke={color} strokeWidth="1.5" fill="none"/><path d="M16 8h4l3 4v4h-7V8z" stroke={color} strokeWidth="1.5" fill="none"/><circle cx="5.5" cy="18.5" r="2.5" stroke={color} strokeWidth="1.5" fill="none"/><circle cx="18.5" cy="18.5" r="2.5" stroke={color} strokeWidth="1.5" fill="none"/></>,
    person: <><circle cx="12" cy="8" r="4" stroke={color} strokeWidth="1.5" fill="none"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round"/></>,
    map: <><path d="M9 3L3 6v15l6-3 6 3 6-3V3l-6 3-6-3z" stroke={color} strokeWidth="1.5" fill="none" strokeLinejoin="round"/><line x1="9" y1="3" x2="9" y2="18" stroke={color} strokeWidth="1.5"/><line x1="15" y1="6" x2="15" y2="21" stroke={color} strokeWidth="1.5"/></>,
    analytics: <><path d="M5 19V9M9 19V5M13 19v-6M17 19v-3M21 19V7" stroke={color} strokeWidth="2" strokeLinecap="round"/></>,
    search: <><circle cx="11" cy="11" r="8" stroke={color} strokeWidth="1.5" fill="none"/><path d="M21 21l-4.35-4.35" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></>,
    bell: <><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke={color} strokeWidth="1.5" fill="none"/><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke={color} strokeWidth="1.5" fill="none"/></>,
    settings: <><circle cx="12" cy="12" r="3" stroke={color} strokeWidth="1.5" fill="none"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke={color} strokeWidth="1.5" fill="none"/></>,
    help: <><circle cx="12" cy="12" r="10" stroke={color} strokeWidth="1.5" fill="none"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="12" y1="17" x2="12.01" y2="17" stroke={color} strokeWidth="2" strokeLinecap="round"/></>,
    trendUp: <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
    trendDown: <polyline points="23 18 13.5 8.5 8.5 13.5 1 6" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
    warning: <><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke={color} strokeWidth="1.5" fill="none"/><line x1="12" y1="9" x2="12" y2="13" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="12" y1="17" x2="12.01" y2="17" stroke={color} strokeWidth="2" strokeLinecap="round"/></>,
    error: <><circle cx="12" cy="12" r="10" stroke={color} strokeWidth="1.5" fill="none"/><line x1="15" y1="9" x2="9" y2="15" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="9" y1="9" x2="15" y2="15" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></>,
    filter: <><line x1="4" y1="6" x2="20" y2="6" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="8" y1="12" x2="16" y2="12" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="11" y1="18" x2="13" y2="18" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></>,
    chevLeft: <polyline points="15 18 9 12 15 6" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
    chevRight: <polyline points="9 18 15 12 9 6" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>,
    plus: <><line x1="12" y1="5" x2="12" y2="19" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></>,
    ai: <><path d="M12 2a5 5 0 0 1 5 5v2h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h1V7a5 5 0 0 1 5-5z" stroke={color} strokeWidth="1.5" fill="none"/><circle cx="9" cy="14" r="1" fill={color}/><circle cx="15" cy="14" r="1" fill={color}/></>,
    download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round"/><polyline points="7 10 12 15 17 10" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/><line x1="12" y1="15" x2="12" y2="3" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style={{flexShrink:0, display:"inline-block", verticalAlign:"middle"}}>
      {icons[name] || null}
    </svg>
  );
};

const SparkBars = ({ values, color, height = 56 }) => {
  const max = Math.max(...values);
  return (
    <div style={{ display:"flex", alignItems:"flex-end", gap:3, height }}>
      {values.map((v, i) => (
        <div key={i} style={{
          flex:1, borderRadius:2,
          background: i === values.length - 1 ? color : T.surface2,
          height:`${(v/max)*100}%`,
        }}/>
      ))}
    </div>
  );
};

const PulseDot = ({ color }) => (
  <span style={{ position:"relative", display:"inline-flex", width:10, height:10, flexShrink:0 }}>
    <span style={{ position:"absolute", inset:0, borderRadius:"50%", background:color, animation:"ping 1.4s cubic-bezier(0,0,0.2,1) infinite", opacity:0.5 }}/>
    <span style={{ borderRadius:"50%", width:10, height:10, background:color, display:"block" }}/>
  </span>
);

const AIPanel = ({ onClose }) => {
  const [text, setText] = useState("");
  const [done, setDone] = useState(false);
  const full = "Based on real-time telemetry across 154 active units, 3 vehicles require immediate maintenance attention. Projected on-time delivery rate for today: 96.4% — up 0.8 pts. Route CHI→DET is experiencing a 12-min average lag; rerouting via I-94 is recommended.";
  const ref = useRef(0);
  useEffect(() => {
    const id = setInterval(() => {
      ref.current += 2;
      if (ref.current >= full.length) { setText(full); setDone(true); clearInterval(id); }
      else setText(full.slice(0, ref.current));
    }, 22);
    return () => clearInterval(id);
  }, []);
  return (
    <div style={{ position:"fixed", top:72, right:24, width:340, background:T.primary, borderRadius:12, padding:24, boxShadow:"0 20px 60px rgba(0,27,68,.4)", zIndex:200, color:T.onPrimary }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <Icon name="ai" size={18} color={T.secondaryC}/>
          <span style={{ fontFamily:"Manrope,sans-serif", fontWeight:800, fontSize:13, letterSpacing:"0.06em", textTransform:"uppercase" }}>Fleet AI · Insight</span>
        </div>
        <button onClick={onClose} style={{ background:"none", border:"none", color:"rgba(255,255,255,.5)", cursor:"pointer", fontSize:20, lineHeight:1 }}>×</button>
      </div>
      <p style={{ fontFamily:"Inter,sans-serif", fontSize:13, lineHeight:1.75, color:"rgba(255,255,255,.85)", minHeight:100 }}>
        {text}{!done && <span style={{ borderRight:"2px solid", paddingLeft:1, animation:"blink 1s step-end infinite" }}/>}
      </p>
      <div style={{ marginTop:16, display:"flex", gap:8, flexWrap:"wrap" }}>
        {["Reroute CHI→DET","Flag Maintenance"].map(a => (
          <button key={a} style={{ padding:"6px 12px", borderRadius:6, border:"1px solid rgba(255,255,255,.2)", background:"rgba(255,255,255,.08)", color:T.onPrimary, fontSize:11, fontWeight:700, cursor:"pointer" }}>{a}</button>
        ))}
      </div>
    </div>
  );
};

const MapCanvas = () => {
  const [activePin, setActivePin] = useState(null);
  const pins = [
    { id:1, x:"40%", y:"35%", type:"active", label:"Truck #4422", detail:"CHI→DET · On Schedule" },
    { id:2, x:"63%", y:"55%", type:"alert",  label:"Truck #6651", detail:"ATL→MIA · Delayed 14m" },
    { id:3, x:"28%", y:"60%", type:"idle",   label:"Truck #1148", detail:"PHX Depot · Loading" },
  ];
  const pinColors = { active:T.secondary, alert:T.error, idle:T.amber };
  return (
    <div style={{ position:"relative", width:"100%", height:"100%", background:T.surfaceDim, overflow:"hidden", borderRadius:6 }}>
      <svg style={{ position:"absolute", inset:0, width:"100%", height:"100%", opacity:0.1 }}>
        {[...Array(8)].map((_,i)=><line key={"h"+i} x1="0" y1={`${(i+1)*12.5}%`} x2="100%" y2={`${(i+1)*12.5}%`} stroke={T.primary} strokeWidth="1"/>)}
        {[...Array(10)].map((_,i)=><line key={"v"+i} x1={`${(i+1)*10}%`} y1="0" x2={`${(i+1)*10}%`} y2="100%" stroke={T.primary} strokeWidth="1"/>)}
      </svg>
      <svg style={{ position:"absolute", inset:0, width:"100%", height:"100%" }}>
        <path d="M0,200 Q200,160 400,200 T800,220" stroke={T.onSurfaceV} strokeWidth="4" strokeOpacity="0.12" fill="none"/>
        <path d="M150,0 Q250,120 230,220 T200,440" stroke={T.onSurfaceV} strokeWidth="3" strokeOpacity="0.10" fill="none"/>
        <path d="M0,300 Q300,260 560,240 T800,160" stroke={T.onSurfaceV} strokeWidth="3" strokeOpacity="0.08" fill="none"/>
        <path d="M400,0 Q430,140 480,240 T520,440" stroke={T.onSurfaceV} strokeWidth="3" strokeOpacity="0.10" fill="none"/>
        <path d="M230,260 Q270,190 320,140" stroke={T.secondary} strokeWidth="2.5" strokeOpacity="0.7" fill="none" strokeDasharray="6 3"/>
        <path d="M320,140 Q400,180 500,220" stroke={T.error} strokeWidth="2.5" strokeOpacity="0.7" fill="none" strokeDasharray="6 3"/>
      </svg>
      <div style={{ position:"absolute", top:"16%", left:"70%", width:36, height:36, borderRadius:"50%", background:`${T.primary}22`, display:"flex", alignItems:"center", justifyContent:"center" }}>
        <div style={{ background:T.primary, color:T.onPrimary, fontSize:10, fontWeight:800, borderRadius:"50%", width:24, height:24, display:"flex", alignItems:"center", justifyContent:"center" }}>22</div>
      </div>
      {pins.map(p => (
        <div key={p.id} style={{ position:"absolute", left:p.x, top:p.y, transform:"translate(-50%,-100%)", cursor:"pointer", zIndex:5 }}
          onMouseEnter={()=>setActivePin(p.id)} onMouseLeave={()=>setActivePin(null)}>
          <div style={{ width:24, height:24, borderRadius:"50% 50% 50% 0", background:pinColors[p.type], transform:"rotate(-45deg)", border:"3px solid white", boxShadow:"0 2px 8px rgba(0,0,0,.25)" }}/>
          {activePin===p.id && (
            <div style={{ position:"absolute", bottom:"calc(100% + 10px)", left:"50%", transform:"translateX(-50%)", background:T.primary, color:T.onPrimary, borderRadius:6, padding:"8px 12px", fontSize:11, fontWeight:700, whiteSpace:"nowrap", boxShadow:"0 4px 16px rgba(0,27,68,.3)", zIndex:10 }}>
              <div style={{ fontFamily:"Manrope,sans-serif" }}>{p.label}</div>
              <div style={{ color:"rgba(255,255,255,.6)", fontWeight:400, marginTop:2 }}>{p.detail}</div>
            </div>
          )}
        </div>
      ))}
      <div style={{ position:"absolute", top:12, left:12, background:"rgba(255,255,255,.92)", backdropFilter:"blur(8px)", borderRadius:6, padding:"10px 14px", boxShadow:"0 4px 16px rgba(0,27,68,.08)" }}>
        <div style={{ fontSize:9, fontWeight:800, letterSpacing:"0.08em", textTransform:"uppercase", color:T.onSurface, marginBottom:8 }}>Fleet Visibility</div>
        <div style={{ display:"flex", gap:16 }}>
          {[["Active","142",T.secondary],["Idle","12",T.amber],["Alert","3",T.error]].map(([l,v,c])=>(
            <div key={l} style={{ display:"flex", alignItems:"center", gap:5 }}>
              <PulseDot color={c}/>
              <span style={{ fontSize:10, fontWeight:700, color:T.onSurfaceV }}>{l} ({v})</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{ position:"absolute", bottom:12, right:12, display:"flex", flexDirection:"column", gap:1 }}>
        {["+","−"].map(c=>(
          <button key={c} style={{ width:36, height:36, background:T.surface0, border:`1px solid ${T.outline}50`, borderRadius:c==="+"?"4px 4px 0 0":"0 0 4px 4px", cursor:"pointer", fontSize:16, fontWeight:300, color:T.onSurface }}>{c}</button>
        ))}
      </div>
    </div>
  );
};

const StatusBadge = ({ status }) => {
  const map = {
    "In Transit":{ bg:`${T.secondaryC}33`, color:T.onSecC,     dot:T.secondary },
    "At Depot":  { bg:`${T.amber}44`,      color:"#6e3900",    dot:T.amber },
    "Delayed":   { bg:T.errorBg,           color:T.error,      dot:T.error },
    "Idle":      { bg:T.surface2,          color:T.onSurfaceV, dot:T.outline },
    "Active":    { bg:`${T.secondaryC}33`, color:T.onSecC,     dot:T.secondary },
    "At Rest":   { bg:T.amberBg,           color:"#6e3900",    dot:T.amber },
  };
  const s = map[status] || map["Idle"];
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:5, padding:"4px 10px", borderRadius:20, background:s.bg, color:s.color, fontSize:10, fontWeight:800, letterSpacing:"0.04em", textTransform:"uppercase", whiteSpace:"nowrap" }}>
      <PulseDot color={s.dot}/> {status}
    </span>
  );
};

const HealthChip = ({ warning }) => {
  if (!warning) return <span style={{ fontSize:10, fontWeight:600, color:T.onSurfaceV, padding:"3px 8px", background:T.surface1, borderRadius:4 }}>None Detected</span>;
  const isErr = warning.includes("Pressure")||warning.includes("Engine");
  return (
    <span style={{ display:"inline-flex", alignItems:"center", gap:4, padding:"3px 8px", borderRadius:4, fontSize:10, fontWeight:700, background:isErr?T.errorBg:T.amberBg, color:isErr?T.error:"#6e3900" }}>
      <Icon name={isErr?"error":"warning"} size={12} color={isErr?T.error:"#6e3900"}/> {warning}
    </span>
  );
};

const ProgressBar = ({ pct, color=T.primary }) => (
  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
    <div style={{ flex:1, height:6, borderRadius:3, background:T.surface2, overflow:"hidden" }}>
      <div style={{ width:`${pct}%`, height:"100%", background:color, borderRadius:3 }}/>
    </div>
    <span style={{ fontSize:11, fontWeight:700, color:pct===100?T.secondary:color, minWidth:32 }}>{pct===100?"Done":`${pct}%`}</span>
  </div>
);

function App() {
  const [navActive, setNavActive] = useState("Dashboard");
  const [driverTab, setDriverTab] = useState("All Drivers");
  const [showAI, setShowAI] = useState(false);
  const [aiKey, setAiKey] = useState(0);
  const [page, setPage] = useState(1);
  const [searchQ, setSearchQ] = useState("");

  const navItems = [
    { label:"Dashboard",         icon:"dashboard" },
    { label:"Fleet Status",      icon:"truck" },
    { label:"Driver Management", icon:"person" },
    { label:"Routes",            icon:"map" },
    { label:"Analytics",         icon:"analytics" },
  ];

  const drivers = [
    { id:"#DX-9022", name:"John Smith",      status:"In Transit", route:"CHI → DET", rem:"42m rem.",    health:null,               efficiency:98.4, progress:72,  vehicle:"Volvo FH16" },
    { id:"#DX-1148", name:"Ava Miller",       status:"At Depot",   route:"PHX",       rem:"Loading",     health:"Low Tire Pressure", efficiency:87.2, progress:0,   vehicle:"Isuzu NPR" },
    { id:"#DX-8831", name:"Robert Patterson", status:"In Transit", route:"ATL → MIA", rem:"2h 14m rem.", health:"Brake Wear (L2)",  efficiency:91.0, progress:34,  vehicle:"Scania R500" },
    { id:"#DX-2210", name:"Linda Davis",      status:"Idle",       route:"I-80",      rem:"Rest Area",   health:null,               efficiency:95.6, progress:100, vehicle:"Mercedes Atego" },
    { id:"#DX-4471", name:"Jameson Miller",   status:"Active",     route:"CHI → STL", rem:"1h 5m rem.",  health:null,               efficiency:98.1, progress:55,  vehicle:"Volvo FH16" },
    { id:"#DX-7723", name:"Leila Vance",      status:"At Rest",    route:"DET",       rem:"Overnight",   health:"Engine Warning",   efficiency:94.1, progress:100, vehicle:"Isuzu NPR" },
    { id:"#DX-6651", name:"Marcus Reid",      status:"Delayed",    route:"ATL → MIA", rem:"+14m delay",  health:null,               efficiency:82.0, progress:34,  vehicle:"Scania R500" },
  ];

  const filtered = drivers.filter(d => {
    const q = searchQ.toLowerCase();
    const ms = !q || d.name.toLowerCase().includes(q) || d.id.toLowerCase().includes(q) || d.route.toLowerCase().includes(q);
    const mt = driverTab==="All Drivers" || (driverTab==="In Transit"&&(d.status==="In Transit"||d.status==="Active")) || (driverTab==="Maintenance"&&d.health);
    return ms && mt;
  });

  const PAGE_SIZE = 4;
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
  const paged = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  const metrics = [
    { label:"Delivery Success Rate", value:"98.2%",    delta:"+1.2%", up:true,  bars:[40,55,62,75,68,82,100], accent:T.secondary, bc:T.secondary },
    { label:"Average Delay Time",    value:"14 min",   delta:"−4.3%", up:false, bars:[100,80,70,50,60,40,30],  accent:T.error,    bc:T.error },
    { label:"Fuel Efficiency",       value:"9.2 km/l", delta:"+4.2%", up:true,  bars:[50,60,42,72,88,54,78],  accent:T.primary,  bc:T.primary },
  ];

  return (
    <div style={{ display:"flex", height:"100vh", fontFamily:"Inter,sans-serif", background:T.bg, overflow:"hidden" }}>

      {/* Sidebar */}
      <aside style={{ width:232, background:T.primary, display:"flex", flexDirection:"column", flexShrink:0 }}>
        <div style={{ padding:"24px 20px 16px" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:4 }}>
            <div style={{ width:32, height:32, borderRadius:8, background:T.primaryC, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <Icon name="truck" size={16} color={T.onPrimary}/>
            </div>
            <span style={{ fontFamily:"Manrope,sans-serif", fontWeight:800, fontSize:17, color:T.onPrimary }}>Logistics Pro</span>
          </div>
          <p style={{ fontSize:9, fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", color:"rgba(255,255,255,.4)", paddingLeft:42 }}>National Fleet Admin</p>
        </div>

        <nav style={{ flex:1, padding:"8px 12px", display:"flex", flexDirection:"column", gap:2 }}>
          {navItems.map(({label,icon})=>{
            const active = navActive===label;
            return (
              <button key={label} onClick={()=>setNavActive(label)} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 12px", borderRadius:8, background:active?T.primaryC:"transparent", color:active?T.onPrimary:"rgba(255,255,255,.55)", border:"none", cursor:"pointer", textAlign:"left", width:"100%", fontSize:13, fontWeight:active?700:500 }}>
                <Icon name={icon} size={18} color={active?T.onPrimary:"rgba(255,255,255,.55)"}/>
                {label}
              </button>
            );
          })}
        </nav>

        <div style={{ padding:"12px", borderTop:"1px solid rgba(255,255,255,.08)" }}>
          <button onClick={()=>{setAiKey(k=>k+1);setShowAI(true);}} style={{ display:"flex", alignItems:"center", gap:8, width:"100%", padding:"10px 12px", borderRadius:8, background:"linear-gradient(135deg,rgba(141,249,168,.12),rgba(141,249,168,.05))", border:"1px solid rgba(141,249,168,.2)", cursor:"pointer", color:T.secondaryC, fontSize:12, fontWeight:700 }}>
            <Icon name="ai" size={16} color={T.secondaryC}/> Fleet AI · Insights
          </button>
        </div>

        <div style={{ padding:"16px 20px", borderTop:"1px solid rgba(255,255,255,.08)", display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ width:36, height:36, borderRadius:"50%", background:T.primaryC, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
            <span style={{ fontSize:13, fontWeight:800, color:T.onPrimary }}>LR</span>
          </div>
          <div>
            <div style={{ fontSize:13, fontWeight:700, color:T.onPrimary }}>Logeshkumar R</div>
            <div style={{ fontSize:9, fontWeight:600, letterSpacing:"0.08em", textTransform:"uppercase", color:"rgba(255,255,255,.4)" }}>System Administrator</div>
          </div>
        </div>
      </aside>

      {/* Main */}
      <main style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>

        {/* Topbar */}
        <header style={{ height:60, background:T.surface0, borderBottom:`1px solid ${T.outline}25`, display:"flex", alignItems:"center", justifyContent:"space-between", padding:"0 28px", flexShrink:0 }}>
          <div style={{ display:"flex", alignItems:"center", gap:20, flex:1 }}>
            <span style={{ fontFamily:"Manrope,sans-serif", fontWeight:800, fontSize:16, color:T.onSurface, whiteSpace:"nowrap" }}>Delivery Dashboard</span>
            <div style={{ position:"relative", width:300 }}>
              <div style={{ position:"absolute", left:10, top:"50%", transform:"translateY(-50%)" }}>
                <Icon name="search" size={15} color={T.onSurfaceV}/>
              </div>
              <input value={searchQ} onChange={e=>{setSearchQ(e.target.value);setPage(1);}} placeholder="Search fleet, drivers, or routes…" style={{ width:"100%", padding:"7px 12px 7px 34px", background:T.surface1, border:"none", borderRadius:4, fontSize:12, color:T.onSurface, outline:"none", fontFamily:"Inter,sans-serif" }}/>
            </div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:12 }}>
            {[{icon:"bell",badge:true},{icon:"settings"},{icon:"help"}].map(({icon,badge})=>(
              <button key={icon} style={{ position:"relative", background:"none", border:"none", cursor:"pointer", padding:4, color:T.onSurfaceV }}>
                <Icon name={icon} size={19} color={T.onSurfaceV}/>
                {badge&&<span style={{ position:"absolute", top:2, right:2, width:7, height:7, borderRadius:"50%", background:T.error, border:`2px solid ${T.surface0}` }}/>}
              </button>
            ))}
            <div style={{ width:1, height:24, background:`${T.outline}40` }}/>
            <div style={{ width:32, height:32, borderRadius:"50%", background:T.surface2, display:"flex", alignItems:"center", justifyContent:"center" }}>
              <span style={{ fontSize:12, fontWeight:800, color:T.onSurface }}>AU</span>
            </div>
          </div>
        </header>

        {/* Scrollable content */}
        <div style={{ flex:1, overflow:"auto", padding:"20px 24px", display:"flex", flexDirection:"column", gap:20 }}>

          {/* Map + metrics row */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 280px", gap:16, height:420 }}>
            <div style={{ background:T.surface0, borderRadius:6, overflow:"hidden", boxShadow:`0 2px 12px rgba(0,27,68,.06)` }}>
              <MapCanvas/>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {metrics.map((m,i)=>(
                <div key={i} style={{ flex:1, background:T.surface0, borderRadius:6, padding:"16px 18px", borderLeft:`4px solid ${m.bc}`, boxShadow:`0 2px 12px rgba(0,27,68,.05)`, display:"flex", flexDirection:"column", justifyContent:"space-between" }}>
                  <div>
                    <div style={{ fontSize:9, fontWeight:800, letterSpacing:"0.09em", textTransform:"uppercase", color:T.onSurfaceV, marginBottom:6 }}>{m.label}</div>
                    <div style={{ display:"flex", alignItems:"baseline", gap:8 }}>
                      <span style={{ fontFamily:"Manrope,sans-serif", fontSize:26, fontWeight:800, color:T.onSurface, lineHeight:1 }}>{m.value}</span>
                      <span style={{ display:"inline-flex", alignItems:"center", gap:2, padding:"2px 7px", borderRadius:3, background:m.up?`${T.secondaryC}33`:T.errorBg, color:m.up?T.onSecC:T.error, fontSize:10, fontWeight:800 }}>
                        <Icon name={m.up?"trendUp":"trendDown"} size={10} color={m.up?T.onSecC:T.error}/> {m.delta}
                      </span>
                    </div>
                  </div>
                  <SparkBars values={m.bars} color={m.accent} height={44}/>
                </div>
              ))}
            </div>
          </div>

          {/* Driver table */}
          <section style={{ background:T.surface0, borderRadius:6, boxShadow:`0 2px 12px rgba(0,27,68,.05)`, overflow:"hidden" }}>
            <div style={{ padding:"16px 20px", borderBottom:`1px solid ${T.outline}18`, display:"flex", justifyContent:"space-between", alignItems:"center", background:`${T.surface1}60`, flexWrap:"wrap", gap:10 }}>
              <div>
                <h2 style={{ fontFamily:"Manrope,sans-serif", fontWeight:800, fontSize:15, color:T.onSurface }}>Fleet Driver Manifest</h2>
                <p style={{ fontSize:11, color:T.onSurfaceV, marginTop:2 }}>Real-time shift tracking and performance metrics</p>
              </div>
              <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                <div style={{ display:"flex", border:`1px solid ${T.outline}40`, borderRadius:4, overflow:"hidden" }}>
                  {["All Drivers","In Transit","Maintenance"].map(t=>(
                    <button key={t} onClick={()=>{setDriverTab(t);setPage(1);}} style={{ padding:"6px 12px", fontSize:11, fontWeight:700, border:"none", cursor:"pointer", background:driverTab===t?T.primary:"transparent", color:driverTab===t?T.onPrimary:T.onSurfaceV }}>{t}</button>
                  ))}
                </div>
                <button style={{ display:"flex", alignItems:"center", gap:5, padding:"6px 12px", background:T.surface2, border:`1px solid ${T.outline}30`, borderRadius:4, fontSize:11, fontWeight:700, cursor:"pointer", color:T.onSurface }}>
                  <Icon name="filter" size={13} color={T.onSurface}/> Filter
                </button>
                <button style={{ display:"flex", alignItems:"center", gap:5, padding:"6px 12px", background:T.primary, border:"none", borderRadius:4, fontSize:11, fontWeight:700, cursor:"pointer", color:T.onPrimary }}>
                  <Icon name="plus" size={13} color={T.onPrimary}/> Add Driver
                </button>
                <button style={{ display:"flex", alignItems:"center", gap:5, padding:"6px 12px", background:T.surface1, border:`1px solid ${T.outline}30`, borderRadius:4, fontSize:11, fontWeight:700, cursor:"pointer", color:T.onSurfaceV }}>
                  <Icon name="download" size={13} color={T.onSurfaceV}/> Export
                </button>
              </div>
            </div>

            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse" }}>
                <thead>
                  <tr style={{ background:`${T.surface1}50` }}>
                    {["Driver","Vehicle","Route Status","Progress","Health","Efficiency","Action"].map(h=>(
                      <th key={h} style={{ padding:"11px 16px", textAlign:h==="Efficiency"||h==="Action"?"right":"left", fontSize:9, fontWeight:800, letterSpacing:"0.09em", textTransform:"uppercase", color:T.onSurfaceV, borderBottom:`1px solid ${T.outline}18` }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {paged.length===0 ? (
                    <tr><td colSpan={7} style={{ padding:"40px", textAlign:"center", color:T.onSurfaceV, fontSize:13 }}>No drivers match this filter.</td></tr>
                  ) : paged.map((d,i)=>(
                    <tr key={d.id} style={{ borderBottom:`1px solid ${T.outline}12`, background:i%2===0?"transparent":`${T.surface1}30` }}
                      onMouseEnter={e=>e.currentTarget.style.background=T.surface1}
                      onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"transparent":`${T.surface1}30`}>
                      <td style={{ padding:"13px 16px" }}>
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                          <div style={{ width:34, height:34, borderRadius:4, background:T.surface2, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                            <span style={{ fontSize:11, fontWeight:800, color:T.onSurface }}>{d.name.split(" ").map(x=>x[0]).join("")}</span>
                          </div>
                          <div>
                            <div style={{ fontSize:13, fontWeight:700, color:T.onSurface }}>{d.name}</div>
                            <div style={{ fontSize:10, color:T.onSurfaceV, fontFamily:"monospace", marginTop:1 }}>{d.id}</div>
                          </div>
                        </div>
                      </td>
                      <td style={{ padding:"13px 16px", fontSize:12, color:T.onSurface, fontWeight:500 }}>{d.vehicle}</td>
                      <td style={{ padding:"13px 16px" }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                          <StatusBadge status={d.status}/>
                          <span style={{ fontSize:10, color:T.onSurfaceV }}>{d.route} · {d.rem}</span>
                        </div>
                      </td>
                      <td style={{ padding:"13px 16px", minWidth:120 }}>
                        <ProgressBar pct={d.progress} color={d.status==="Delayed"?T.error:T.primary}/>
                      </td>
                      <td style={{ padding:"13px 16px" }}>
                        <HealthChip warning={d.health}/>
                      </td>
                      <td style={{ padding:"13px 16px", textAlign:"right" }}>
                        <span style={{ fontSize:13, fontWeight:800, color:d.efficiency>=95?T.secondary:d.efficiency>=85?T.onSurface:T.error }}>{d.efficiency}%</span>
                      </td>
                      <td style={{ padding:"13px 16px", textAlign:"right" }}>
                        <button style={{ padding:"5px 12px", background:T.primary, color:T.onPrimary, border:"none", borderRadius:4, fontSize:10, fontWeight:800, letterSpacing:"0.05em", textTransform:"uppercase", cursor:"pointer" }}>Dispatch</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div style={{ padding:"10px 20px", borderTop:`1px solid ${T.outline}18`, display:"flex", justifyContent:"space-between", alignItems:"center", background:`${T.surface1}30` }}>
              <span style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.05em", color:T.onSurfaceV }}>
                Showing {paged.length} of {filtered.length} drivers
              </span>
              <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                <button onClick={()=>setPage(p=>Math.max(1,p-1))} style={{ padding:4, background:"none", border:"none", cursor:"pointer" }}>
                  <Icon name="chevLeft" size={16} color={T.onSurfaceV}/>
                </button>
                {[...Array(totalPages)].map((_,i)=>(
                  <button key={i} onClick={()=>setPage(i+1)} style={{ width:28, height:28, borderRadius:4, border:"none", cursor:"pointer", background:page===i+1?T.primary:"transparent", color:page===i+1?T.onPrimary:T.onSurfaceV, fontSize:11, fontWeight:700 }}>{String(i+1).padStart(2,"0")}</button>
                ))}
                <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} style={{ padding:4, background:"none", border:"none", cursor:"pointer" }}>
                  <Icon name="chevRight" size={16} color={T.onSurfaceV}/>
                </button>
              </div>
            </div>
          </section>

        </div>
      </main>

      {showAI && <AIPanel key={aiKey} onClose={()=>setShowAI(false)}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
